services:
  db:
    image: postgres:17
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env

    # здесь лежит ваш manage.py
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # ждём, пока БД станет готова, а потом мигрируем и стартуем сервер
    command: >
      sh -c "
        until pg_isready -h db -U ${POSTGRES_USER}; do
          echo 'Waiting for Postgres...'; sleep 2;
        done &&
        poetry run python booking_hotel/manage.py migrate --noinput &&
        poetry run python booking_hotel/manage.py runserver 0.0.0.0:8000
      "


volumes:
  pg_data:
